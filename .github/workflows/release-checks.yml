name: Release checks
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_FIREBASE_API_KEY: demo-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-lineagetree.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-lineagetree
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-lineagetree.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      EXPO_PUBLIC_FIREBASE_APP_ID: demo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
